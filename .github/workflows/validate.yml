name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.236.2
    container:
      image: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned: an unpinned npx can serve a stale cached Renovate that rejects
      # newer options (managerFilePatterns needs 38+).
      - run: npx -y -p "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict default.json renovate.json
